{% set name = "labjackpython" %}
{% set version = "2.3.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 00b6eec2b96796ae82826d9b98f4c600eb83c7e2cd88fb9d9e73c239c804e7e3

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools
  run:
    - python >={{ python_min }}

test:
  imports:
    - LabJackPython
    - Modbus
    - u12
    - u3
    - u6
    - ue9
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://labjack.com/support/software/examples/ud/labjackpython
  summary: The LabJack Python modules for the LabJack U3, U6, UE9 and U12.
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - jjerphan
    - kastman
